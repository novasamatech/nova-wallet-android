
android {

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    namespace 'io.novafoundation.nova.core_db'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation substrateSdkDep

    implementation project(":common")
    implementation gsonDep

    implementation kotlinDep

    implementation coroutinesDep

    implementation daggerDep
    ksp daggerCompiler

    implementation roomDep
    implementation roomKtxDep
    ksp roomCompiler

    androidTestImplementation androidTestRunnerDep
    androidTestImplementation androidTestRulesDep
    androidTestImplementation androidJunitDep

    androidTestImplementation roomTestsDep
    testImplementation project(':test-shared')
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

// The standalone test APK includes web3j's obsolete provider as well as the SDK's current provider.
configurations.matching { it.name.endsWith('AndroidTestRuntimeClasspath') }.configureEach {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
}
