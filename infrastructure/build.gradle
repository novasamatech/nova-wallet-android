// Profile 3 still uses Play Integrity for registration; it does not bypass the backend's
// device, app and certificate policy. The environment comes from remote config (infraUrl).
android {

    buildFeatures {
        buildConfig = true
    }

    // Attestation logs through android.util.Log in debug builds; JVM tests exercise those paths
    testOptions {
        unitTests.returnDefaultValues = true
    }

    namespace 'io.novafoundation.nova.infrastructure'
}

dependencies {
    implementation project(':common')

    implementation kotlinDep
    implementation coroutinesDep

    implementation daggerDep
    ksp daggerCompiler

    implementation retrofitDep

    implementation gsonDep

    testImplementation jUnitDep
    testImplementation mockitoDep
    testImplementation coroutinesTestDep
}
