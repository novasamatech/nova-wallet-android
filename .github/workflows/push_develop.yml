name: Build test and deploy develop apk

on:
  push:
    branches: [develop]

jobs:
  build:
    uses: ./.github/workflows/reusable_android_build.yml
    with:
      gradlew-command: assembleDevelop
    secrets: inherit

  upload-to-firebase:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Fetch secrets from Scaleway
        uses: ./.github/actions/install
        with:
          scw_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          scw_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          scw_default_project_id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          scw_default_organization_id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          minimal_mode: "true"

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: app

      - name: 🗳 Upload to Firebase
        uses: ./.github/actions/upload-to-firebase
        with:
          appId: ${{ env.DEVELOP_FIREBASE_APP_ID }}
          firebase-token: ${{ env.DEVELOP_FIREBASE_SERVICE_ACCOUNT_JSON }}
          releaseNotes: ${{ github.event.head_commit.message }}
          test-groups: dev-team
          upload-file: app/develop/app-develop.apk

  upload-to-s3:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      s3_url: ${{ steps.s3_upload.outputs.s3_url }}
    env:
      S3_BUCKET: s3://nova-wallet-android-app
      S3_REGION: nl-ams

    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Fetch secrets from Scaleway
        uses: ./.github/actions/install
        with:
          scw_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          scw_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          scw_default_project_id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          scw_default_organization_id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          minimal_mode: "true"

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: app

      - name: ⚙️ Upload to S3
        id: s3_upload
        uses: ./.github/actions/upload-to-s3
        with:
          s3_region: ${{ env.S3_REGION }}
          s3_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          s3_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          s3_bucket: ${{ env.S3_BUCKET }}
          upload_file: app/develop/app-develop.apk

      - name: Show S3 URL
        run: |
          echo "App uploaded to: ${{ steps.s3_upload.outputs.s3_url }}"

  appium-mobile-tests:
    needs: [upload-to-s3]
    uses: ./.github/workflows/reusable_appium_mobile_tests.yml
    with:
      app_url: ${{ needs.upload-to-s3.outputs.s3_url }}
      test_grep: "android"
      allure_job_run_id: ""
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.PAT_TOKEN }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
